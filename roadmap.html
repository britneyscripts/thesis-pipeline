istic weights.\n* **Extraction Goal:** Find a statistical concept or formula that explains *why* heavily linked data (Google's validation) becomes the most dominant statistical probability in an LLM's output.\n\nDoD: \n\n1. \\[ \\] Watch Lecture.\n2. \\[ \\] Identify 1 connection to the **Common Crawl/Graph Theory** article.\n3. \\[ \\] Extract 1 logic requirement for **Ghostprod** (e.g., \"How will the agent handle statistical outliers in a catalog?\").", "state_name": "In Progress", "state_type": "started", "labels": ["statistic", "USP"]}], "total_count": 4, "completed_count": 0, "progress_pct": 0}, {"id": "2648af2d-dc93-41bb-b315-aac377e47ffb", "name": "Catch Up - Programming for non-programmer", "targetDate": null, "issues": [], "total_count": 0, "completed_count": 0, "progress_pct": 0}], "no_milestone_issues": [], "total_issues": 4, "completed_issues": 0, "progress_pct": 0, "id": "3e2ef1de-3b56-4ea1-9d9a-08eaf208e753"}, {"name": "Ghostprod Platform", "description": "", "milestones": [{"id": "no-milestone", "name": "Outras Atividades & TCC", "targetDate": null, "issues": [{"id": "d596e765-b5c2-4d3d-91f5-7616c87732a3", "identifier": "PLA-56", "title": "Ghostprod: Handling Long API Scan Times (Beta Environment)", "description": "The user identified that `agent1_pagespeed.py` frequently takes a long time or fails due to Google's API behavior. The decision is to explicitly embrace this reality using a UI popup rather than hiding the delay.\n\n## **User Review Required**\n\n**WARNING**\n\nWe need your approval on the UI/UX approach for the popup before changing the frontend code.\n\n## **Proposed Changes**\n\n### **Frontend (**`ghostprod/frontend/src/App.tsx`)\n\n#### **\\[MODIFY\\] App.tsx**\n\nRather than an invasive \"click to dismiss\" popup, I propose injecting a prominent, stylistic **Beta Warning Banner** directly into the `loading` state. During the scan, when the Ghost icon is animating, we will display a dismissable (or persistent) alert box right below it that states something like:\n\n*\"BETA NOTICE: Real-time generation in progress. Google PageSpeed and Spacy NLP are parsing the live URL. This deep analysis may take up to 60 seconds to avoid API limit errors. Please don't refresh.\"*\n\nThis keeps the user anchored and manages expectations without breaking the cyberpunk aesthetic.\n\n### **Backend (**`ghostprod-core/backend/agents/agent1_pagespeed.py`)\n\n#### **\\[MODIFY\\] agent1_pagespeed.py**\n\n* Increase the `timeout` on `requests.get()` from 90s to `120s` (2 minutes).\n* Adjust the printed terminal output and the logging to reflect the increased tolerance for long loading times.\n\n## **Open Questions**\n\n* Do you specifically want a \"Modal/Popup\" that blocks the screen and requires the user to click \"OK, I understand\" *before* the scan starts? Or do you prefer the styling of a **prominent box/banner** that appears *during* the loading phase while the ghost is spinning?\n\n## **Verification Plan**\n\n* Inject the UI code and simulate a long response.\n* Update `npm run build` and `firebase deploy` to sync the changes to production.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "fdfb21ec-b192-4a36-bf7d-c5b14b4b6bda", "identifier": "PLA-55", "title": "DevOps System Design", "description": "# Ghostprod: DevOps & System Design FAQ\n\nEste documento responde às perguntas executivas sobre a arquitetura Cloud, CI/CD, segurança e escolhas de System Design feitas durante o empacotamento da versão 0.3 do Ghostprod. Ele foi redigido com uma perspectiva executiva de Liderança Técnica / Ops.\n\n---\n\n## 1\\. O Pipeline: Cadê o GitHub? O que é DevOps?\n\nO ambiente atual opera como uma arquitetura autônoma de *Local-to-Cloud Deployment*. O GitHub ainda não está no meio atuando como servidor de integração contínua (CI/CD) pois a esteira de publicação foi rodada localmente, de forma *Agentic* pelo terminal.\n\n**DevOps** é justamente a ponte tecnológica entre o código rodando fechado na máquina (*Dev*) e o produto vivo sendo entregue para clientes na internet de forma escalada (*Ops*). Neste projeto, o DevOps foi executado via comandos imperativos usando ferramentas de gerenciamento da nuvem (`gcloud CLI` e `firebase CLI`), operando pacotes encapsulados, autenticação e DNS.\n\n## 2\\. Lidando com Concorrência: Deadlocks e Playwright\n\n**O Problema (Deadlock):** Inicialmente, os Agentes 2 e 3 tentavam acionar instâncias separadas de um navegador \"invisível\" (*Headless Chrome*) na mesma fração de segundo via `ThreadPoolExecutor` do Python. Como a biblioteca subjacente `playwright` (sync_api) não é thread-safe sob o macOS, isso causava um curto-circuito (race condition) na memória: os dois processos se bloqueavam mutualmente num abraço mortal, travando o servidor principal `Uvicorn` e derrubando a porta :8000.\n\n**A Solução Estratégica:** Transicionamos chamadas de APIs diretas na rede (Google PageSpeed) para execução assíncrona tolerante a concorrência, enquanto isolamos o sub-motor do Navegador Web para uma Fila Estritamente *Sequencial*. A estabilidade virou 100% à custa de uns parcos 15s residuais.\n\n## 3\\. Segurança Anti-Bot: WAF Evasion contra Akamai\n\nGrandes plataformas corporativas (ex: Natura) utilizam **WAF (Web Application Firewall)** da Akamai ou Cloudflare, que ativamente policiam robôs e scraps.\nAnteriormente, nosso Headless Engine era negado imediatamente via Firewall com o erro *HTTP 403 Forbidden* simplesmente porque a assinatura (header de pacotes) o declarava como um robô autônomo.\n\n* **A Tática de Bypass:** Recorremos à ofuscação simples e eficiente (Spoofing) do *User-Agent* no motor Python. Falsificamos completamente a \"identidade\" do scraper, simulando a assinatura nativa do pacote de rede de um usuário real no navegador `Google Chrome / Microsoft Windows`. Com o \"RG\" falso em mãos, abrimos os domínios corporativos para coletar dados ricos (ex: marcações Schema e microtextos HTML) sem gerar ruídos ou flagrantes nos filtros de proteção de IPs.\n\n## 4\\. O Padrão Ouro do Empacotamento: Docker\n\n\"*Na minha máquina funciona*\" nunca existe em arquitetura Cloud. O **Docker** entra para encapsular nosso script numa cápsula universal. Ele congela dezenas de dependências espalhadas pelo seu Mac, misturando isso a um sistema operacional *Debian Linux* puro, e monta um HD virtual.\nExistem inúmeras variantes e tamanhos de imagens para essa fundação (*Alpine*, *Ubuntu*, *Slim*). Porém, adotamos arbitrariamente a super imagem pré-fabricada da Microsoft (`mcr.microsoft.com/playwright:v1.40.0-jammy`) porque montar do zero navegadores C++ Chromium dentro de conteineres Linux em nuvem despende semanas de rastreamento de instabilidades gráficas.\n\n## 5\\. Elasticidade na Nuvem: Google Cloud Run vs Lambdas\n\nSubstituímos o servidor antigo (ligado 24h pagando caro) pela matriz Serverless (FaaS - *Function as a Service*), de comportamento gêmeo do famoso AWS Lambda e das Github M/Functions.\n\n* Quando nenhum de seus clientes acessa o site, o servidor do GCP recua as máquinas e as hiberna para **Zero**. Custo Base = USD $0.00.\n* **Defesa Econômica (**`--max-instances=2`): Optamos por restringir severamente as turbinas do autoscaling limitando o pico dinâmico a apénas 2 contâineres. Se a aplicação sofrer um boom de mídia e 5.000 clientes gerarem requisições simultâneas, o modelo do Google Cloud não alocará dinamicamente 5.000 servidores paralelos (evitando que seu cartão de crédito receba uma conta obscenamente colossal ou ataque DDoS pago). A máquina em si cria apenas um engarrafamento de fila longo e saudável, dentro do *Free Tier*.\n\n## 6\\. O Cofre Forte: Secret Manager\n\nChaves-mestras das APIs pagas não são hardcoded localmente para evitar perigos gigantes de intrusos injetando hacks nas faturas (excesso de cota). As inserimos ativamente nas Variáveis de Ambiente e em abóbadas fechadas (*Secret Manager* via injeção Serverless). Os desenvolvedores não leem de volta essas chaves uma vez salvas em nuvem, protegendo o código inteiramente de desastres de integridade de Git.\n\n## 7\\. Filosofia Operacional e o Hack do CORS\n\nEnquanto operávamos a união da Tela V0.3 no Firebase com a Nuvem do Cloud Run, esbarramos no Erro de Browser (*\"Failed to Fetch\"*), gerado ativamente por políticas internas de restrição cruzada dos browsers de clientes - vulgo mecanismo **CORS**.\n\n* **A Resolução Rápida na Trincheira:** Invés de retornar aos pilares antigos, reabri-lo, codificá-lo localmente o novo domínio, testar, e esperar o build arrastado pelo Docker levar ±4 minutos para deploy total – agimos como *Platform Engineers* táticos. Pelo terminal local (CLI da nuvem) sobreescrevemos o array permissível no ar sob o estado ativo (`gcloud run services update --update-env-vars`), rebotamos suavemente em exatos 3 segundos injetando magicamente a autorização VIP no cérebro isolado e o conserto foi massificado imediatamente.\n\n## 8\\. Stack de Inteligência Nativa: Gemini vs. Família Gemma\n\n* **Modelagem Atual Avançada:** A engine analítica que orquestra Gap Analysis nos JSONLd é executada usando **Gemini 1.5 Flash**. Com a repatriação da arquitetura e APIs Cloud para ecossistema único (GCP + Firebase) destituímos da engrenagem subjacente o motor Claude antigo, unificando a API em uma latência de processamento inferida estupidamente veloz.\n* **A Diferença e Desafio do Model 'Gemma':** E a família estrutural orgânica paralela Gemma? Gemma tem um modelo focado abertamente nos *Open Weights*. Apesar de podermos operar nela, usar localmente necessita de alocações caras e complexas GPU-dependentes (exemplo via endpoints Ollama) ao passo em que APIs Serverless e públicas generativas são restritas ao modelo Gemini robusto.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "40ab5b4e-fe67-41bc-86e5-29a0dc700f1c", "identifier": "PLA-53", "title": "Ghostprod: Documentação Técnica e Arquitetura", "description": "# Ghostprod: Documentação Técnica e Arquitetura\n\nBem-vindo à documentação oficial do motor de extração **Ghostprod** (v0.3). Este documento foi escrito sob a perspectiva da Liderança Técnica (Tech Lead) da aplicação para facilitar o onboarding de desenvolvedores, e explicar a transição da aplicação local (v0.2) para a Arquitetura Robusta em Nuvem (v0.3).\n\n---\n\n## 1\\. Visão Geral da Arquitetura (v0.3 - Cloud Múltipla)\n\nO Ghostprod evoluiu de um script local para uma arquitetura \"Severless\" separada e profissional:\n\n* **Frontend (React/Vite) na Firebase Hosting:** A interface de usuário (SPA). Envia as variáveis e a URL para o Cloud Run. Endereço oficial: `https://ghostprod-b2c3d.web.app`\n* **Backend (FastAPI/Python) no Google Cloud Run:** O cérebro corporativo. Rodando isolado via **Docker**. Processa a IA e regras de negócios. Endereço oficial: `https://ghostprod-backend-399766280478.us-east1.run.app`\n\n---\n\n## 2\\. A Decisão Arquitetural Mais Importante: Paralelismo x Sequencial\n\nNo design original do aplicativo, o arquivo `orchestrator.py` tentava disparar todos os Agentes (1 ao 3) ao mesmo tempo usando o `ThreadPoolExecutor` (fios de processamento paralelos de CPU). Isso foi projetado para economizar tempo, pois cada agente demora de 10 a 15 segundos para rodar.\n\n### O Incidente do Deadlock (Travamento da Porta 8000)\n\nA biblioteca responsável por abrir os navegadores Chrome invisíveis (`playwright` na sua `sync_api`) **não é thread-safe**. Quando o Orquestrador mandava o Agente 2 e o Agente 3 abrirem o Chrome no mesmo milissegundo em threads separadas no macOS, o motor interno do Python entrava em curto-circuito (Deadlock/Bootstrap loop), causando o que o navegador reportava como `ERR_CONNECTION_TIMED_OUT`.\n\n**A Solução Híbrida (Vigorando Hoje):**\nPara garantir que o servidor nunca mais trave e nem perca dados em URLs pesadas (como a Home Page ou PDPs com muitas UTMs na URL), o `orchestrator.py` foi re-arquitetado para um formato híbrido:\n\n1. **Agentes de Nuvem (Threads Rápidas):** Tudo o que for chamada de API pura (`requests` para o Google) roda em **paralelo**. Portanto, os dados do PageSpeed são colhidos quase instantaneamente, juntos.\n2. **Agentes de Navegação (Fila Sequencial):** Tudo o que envolver abrir o navegador Playwright (Agente 2 e Agente 3) agora roda sequencialmente. O Agente 3 só começa quando o Agente 2 termina. É mais lento? Sim (adiciona \\~15 segundos ao tempo total da requisição). Mas garante 100% de estabilidade de memória e previne corrupção do loop assíncrono do servidor `Uvicorn`.\n\n---\n\n## 3\\. O Mapa dos Arquivos: Os 5 Agentes de IA\n\nCada arquivo na pasta `agents/` possui uma responsabilidade micro-focada que se junta no resultado do `orchestrator.py`.\n\n### ⚡ `agent1_pagespeed.py`\n\n* **Objetivo:** Bate na API oficial do Google PageSpeed Insights.\n* **Mecânica:** Retorna os Core Web Vitals da URL via chamadas HTTP REST.\n* **Decisão Técnica:** Obrigatório possuir a chave `PSI_API_KEY` cadastrada nas variáveis de ambiente. Caso o Google estoure a cota de limite diário (Erro 400 ou 429), ele devolverá o erro graciosamente via JSON sem derrubar o Uvicorn, para não comprometer o escaneamento do resto no Front.\n\n### 🛑 `agent1_crux.py` (Atualmente de Férias)\n\n* **Objetivo:** Bateria na API do Chrome UX Report para o dado de campo *histórico*.\n* **Decisão Técnica:** Hoje, ele sofre um **Bypass Intencional**. Ele retorna `score: 0` diretamente do código. A decisão foi tomada porque o front-end ainda não possui o dashboard de acompanhamento histórico estilo DebugBear. Chamar a API diariamente a cada F5 gastaria recursos absurdos de rede sem servir a tela.\n\n### 🕵️‍♀️ `agent2_schema.py`\n\n* **Objetivo:** Renderizar a página de produto usando um Headless Chrome (Playwright) para ler o código JSON-LD oculto que os Agentes da OpenAI/Google leem.\n* **Decisão Técnica Anti-Bot:** Antigamente, o firewall WAF da Akamai contratado pela Natura identificava a assinatura clássica do robô (`HeadlessChrome`) e bloqueava a requisição com um erro 403 Forbidden. Para contornar, foi injetado um `User-Agent` universal do Windows/Chrome no método `browser.new_page()`. Agora, aos olhos do Akamai, o código Python é apenas um consumidor visitando o site.\n\n### 📖 `agent3_nlp.py`\n\n* **Objetivo:** Também usa Chrome Headless com a técnica de WAF Evasion para baixar todo o texto legível da tela. Através da engine de linguística NLP (SpaCy), conta quantas vezes jargões \"técnicos de dermatologia\" aparecem.\n\n### 🧑‍⚖️ `agent2_5_schema_quality.py`\n\n* **Objetivo:** Um filtro de auditoria interna. Como o Agente 2 só vê \"estrutura\" (se o campo do preço existe), o Agente 2.5 avalia a *\"qualidade da fofoca\"*. Se o texto do Schema estiver inundado de \"marketing gloss\" (ex: descontos, superscripts de rodapé `¹`, símbolos e propagandas da Black Friday invés de dados concretos do produto), este agente penaliza a nota.\n\n### 🤖 `agent4_gap.py`\n\n* **Objetivo:** O Gran Finale. Pega os dados técnicos garimpados e monta o \"Dossiê\".\n* **Decisão Técnica Recente:** Originalmente programado em Anthropic Claude 3.5. Por decisão de negócio e padronização com a nuvem GCP, o motor foi **migrado para Google Gemini 1.5 Flash**. A biblioteca `google-generativeai` foi ancorada no projeto, e toda a lógica refatorada para utilizar o método `model.generate_content()`. Ele se baseia puramente na resposta textual para descobrir se o produto está \"Agent-Ready\" para um consumidor.\n\n---\n\n## 4\\. A Passagem para Produção: CI/CD e Infraestrutura Cloud (v0.3)\n\nO maior salto arquitetural ocorreu na transição da máquina local para a Nuvem, usando 3 grandes pilares tecnológicos.\n\n### O Empacotamento: Docker e a necessidade do Playwright\n\nPara levar a aplicação à nuvem, não poderíamos apenas \"copiar a pasta Python\". O servidor do Google precisava ter o Chrome original e todas as bibliotecas de sistema C++ instaladas silenciosamente para o **Agente 2 (Schema)** conseguir abrir páginas ocultas.\n\n* **A Solução:** Utilizamos o **Docker**, conectando-se na imagem oficial da Microsoft (`mcr.microsoft.com/playwright:v1.40.0-jammy`). O Docker criou uma \"cápsula Linux\" que instalou o sistema de pacotes, garantindo que o código funcionasse 100% igual ao que rodava no seu Mac M1.\n\n### O Hospedeiro do Cérebro: Google Cloud Run & Secret Manager\n\nUma vez que cápsula Docker foi fechada e empurrada para os servidores via `gcloud`, usamos o **Google Cloud Run** para ligá-la à tomada da internet.\n\n* **Vantagem de Negócio:** O Cloud Run é Serverless. Ele diminui as máquinas a 0 quando você está dormindo e não te cobra 1 centavo inativo. Tivemos que forçar a configuração para a \"Camada Gratuita\" limitando a concorrência a 2 instâncias máximas (`--max-instances=2`).\n* **Gerenciamento de API Keys:** Para não expor as chaves do Gemini no código, excluímos o `.env` do Dockerfile e codificamos essas chaves como segredos embutidos direto na infraestrutura do Google Cloud.\n\n### O Hospedeiro da Cara: Firebase Hosting\n\nO Frontend em React.js (Vite) não usa Docker, pois não tem banco de dados, é apenas código de tela puramente \"estático\".\n\n* **Solução:** Utilizamos o **Firebase Hosting** do Google devido à sua facilidade e CDN global de alta velocidade gratuita.\n* **A \"Mágica\" da Conexão:** Tivemos que injetar o arquivo local `.env.production` contendo a variável `VITE_API_URL` antes de gerar a versão final compressa (`npm run build`). Isso instruiu o código: \"quando rodar no Firebase, não procure por processos `localhost`, comunique-se exclusivamente com a URL HTTPS oficial do Cloud Run\".\n\n---\n\n## 5\\. O Desafio Final das Trincheiras: O Famoso \"CORS\"\n\nNo minuto da V0.3 ir ao ar no Firebase, os botões falharam e exibiram **\"Failed to fetch\"**.\n\n**A Lógica Técnica:** O erro foi engatilhado pelo **CORS** (Cross-Origin Resource Sharing). O CORS é uma política rigorosa de segurança invisível mantida pelos navegadores web modernos (Chrome/Safari) para impedir fraudes financeiras e hacks XSS.\nComo a sua tela oficial morava no portal `https://ghostprod-b2c3d.web.app` (Origem A) e fazia uma requisição XMLHttpRequest direta e assíncrona contra a engrenagem profunda no `https://ghostprod-backend-399766280478` (Origem B), o Backend avaliou a assinatura e recusou o convite. O Backend no código possuía apenas permissão para dar a mão à chamadas que viessem explicitamente do `localhost:3000` ou da família oficial configurada.\n\n**A Resolução Executiva:**\nPara corrigir isso instantaneamente sem rebobinar os 5 minutos lentos da \"Instalação Docker\" de novo, hackeamos via linha de comando (`gcloud run services update`) as variáveis de estado do Google Cloud injetando magicamente a URL do Firebase nas permissões explícitas do motor de Python (`ALLOWED_ORIGINS`). O servidor fez um reload em branco em 3 segundos, reconheceu a URL na lista VIP e destravou o fluxo completo de dados front/back.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "48d8cfba-088a-41a0-aa97-e0a621e297bb", "identifier": "PLA-52", "title": "Plano de Implementação: Evasão Antibot (Akamai WAF) no Backend Python", "description": "## **Diagnóstico**\n\nO frontend React envia a URL via POST para o backend Python (`ghostprod-core/backend`). Lá, os agentes utilizam a biblioteca **Playwright** para renderizar a página. Atualmente, o Playwright está sendo iniciado em modo *headless* sem nenhum cabeçalho customizado. Isso faz com que ele se identifique com a assinatura padrão `HeadlessChrome`, o qual é imediatamente bloqueado pelo firewall Akamai da Natura com um erro 403.\n\n## **Proposed Changes**\n\n### `ghostprod-core/backend/agents/agent2_schema.py`\n\nAdicionar o parâmetro de `user_agent` na criação da página para forçar o Playwright a mentir sobre sua identidade.\n\n#### **\\[MODIFY\\] agent2_schema.py**\n\n* Na linha `page = browser.new_page()`, adicionar: `user_agent=\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36\"`\n\n### `ghostprod-core/backend/agents/agent3_nlp.py`\n\nAplicar a mesma técnica de evasão para o rastreador de densidade NLP.\n\n#### **\\[MODIFY\\] agent3_nlp.py**\n\n* Na linha `page = browser.new_page()`, adicionar a *string* do User-Agent idêntica à do agente 2.\n\n### `ghostprod-core/backend/scanner.py`\n\nAtualizar o script utilitário de scanner para, caso venha a ser testado manualmente, também superar o WAF.\n\n#### **\\[MODIFY\\] scanner.py**\n\n* Atualizar a função `scan_simples` de `AgenticAudit/1.0` para o Chrome User-Agent.\n* Atualizar a função `scan_playwright()` adicionando o parâmetro no `browser.new_page()`.\n\n## **Verification Plan**\n\n* Após essa correção, você testará novamente a URL da Natura na interface de React em `localhost:3000`.\n* O backend Python passará tranquilamente pelo Firewall e extrairá finalmente os dados da PDP.\n* O resultado aparecerá com sucesso no frontend junto com a nota atualizada.\n\n---\n\n# **Plano de Implementação: Migração Claude para Gemini**\n\n## **Diagnóstico**\n\nO usuário solicitou a troca do provedor de IA base do projeto. Atualmente, o Agente 4 (Gap Analysis) na pasta `ghostprod-core/backend/agents/agent4_gap.py` utiliza a API da Anthropic (Claude 3.5 Sonnet) para gerar as respostas. Vamos substituí-lo pela API do Google Gemini (flash).\n\n## **Proposed Changes**\n\n### `ghostprod-core/backend/requirements.txt`\n\n* Remover `anthropic==0.42.0`\n* Adicionar `google-generativeai>=0.8.0`\n\n### `ghostprod-core/backend/agents/agent4_gap.py`\n\n* Substituir as importações da `anthropic` e a busca pela chave `ANTHROPIC_API_KEY`.\n* Injetar o Client de IA do Google (`import google.generativeai as genai`).\n* Trocar a variável de checagem para `GEMINI_API_KEY`.\n* Substituir o método `client.messages.create` pelo método `model.generate_content(prompt)` usando o modelo `gemini-1.5-flash` (ou `gemini-2.5-flash` dependendo do suporte).\n\n## **Verification Plan**\n\n1. Rodar `pip install google-generativeai` no terminal do backend.\n2. Atualizar o arquivo `.env` para incluir `GEMINI_API_KEY=suachave`.\n3. Testar a análise de novo via React Frontend. O diagnóstico será retornado pela IA do Google.\n\n---\n\n# **Plano de Implementação: CrUX Pipeline (Dados Históricos)**\n\n## **Diagnóstico**\n\nO script `crux_pipeline.py` foi projetado para ler dados da Chrome UX Report API (dados de usuários reais) e armazená-los periodicamente, funcionando como um gerador de série temporal (semelhante ao dashboard do DebugBear). A usuária solicitou a criação de um dicionário fixo (lista de URLs alvo do setor de beleza brasileiro) para automatizar esse preenchimento.\n\n## **Proposed Changes**\n\n### `ghostprod-core/backend/data/target_urls.json`\n\n* Criar um json contendo o dicionário onde a chave é o nome da marca e o valor é a URL. \\[NEW\\]\n\n### `ghostprod-core/backend/crux_pipeline.py`\n\n* Adicionar o parser de argumentos nativo do Python (`argparse`) para habilitar formalmente o uso das flags `--url` e `--file`.\n* Ler e iterar sobre o dicionário de marcas carregado de `data/target_urls.json`.\n\n## **Verification Plan**\n\n* Rodar o arquivo `python crux_pipeline.py --file data/target_urls.json` para testar se a leitura do dicionário está processando perfeitamente as 10 marcas indicadas pela usuária.\n\n---\n\n# **Plano de Implementação: Frontend Core Web Vitals (Numerinhos)**\n\n## **Diagnóstico**\n\nA usuária solicitou a exibição da \"linha de numerinhos\" que corresponde à seção de métricas brutas (milissegundos e segundos) vistas na interface web do PageSpeed Insights. Essas métricas são conhecidas como **Core Web Vitals** (ou Métricas de Desempenho).\n\nEmbora o backend em `agent1_pagespeed.py` já extraia esses dados da API do Google (retornando LCP, TBT, CLS, etc., dentro do objeto `metricas`), nosso React atual (`App.tsx`) consome e desenha apenas as notas gerais (Performance, Acessibilidade, etc) nos componentes `CircularScore`.\n\n## **Proposed Changes**\n\n### `ghostprod/frontend/src/App.tsx`\n\n* Adicionar no TypeScript `interface AnalysisResult` o mapeamento para as métricas detalhadas (ex: `lcp: string`, `tbt: string`, etc). \\[MODIFY\\]\n* Extrair `data.agentes.pagespeed.metricas` na função `setResult()`. \\[MODIFY\\]\n* Criar um novo bloco visual em `App.tsx`, logo abaixo das 4 bolinhas, nomeado \"Core Web Vitals\" que renderize uma grade com os valores numéricos em destaque usando badges ou ícones limpos. \\[MODIFY\\]\n\n## **Verification Plan**\n\n* Rodar a análise novamente na interface local `localhost:3000` via botão \"Analyze\".\n* Verificar de forma visual se a linha de \"numerinhos\" aparece contendo LCP, CLS, FCP e TBT com a formatação correta.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "ad6f97b1-19a5-4f01-a672-8ba1b9338208", "identifier": "PLA-46", "title": "GP-11 modelar qual peso cada eixo (performance, schema, NLP) tem no score final usando regressão", "description": "**GP-11.** Quando chegar em **MBA-E-07** (Regressão): modelar qual peso cada eixo (performance, schema, NLP) tem no score final usando regressão. Transforma o ARS de fórmula arbitrária em modelo defensável estatisticamente.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "d8d85e95-5ede-4065-9de0-32021462a5a1", "identifier": "PLA-45", "title": "GP-10 rodar teste sobre os scores do ghostprod", "description": "Quando chegar em **MBA-E-05** (Teste de hipóteses): rodar teste sobre os scores do ghostprod (ex: \"sites com Schema.org completo têm score significativamente maior?\"). Vira seção de validação empírica da tese.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "4d12dec4-d2d3-4fdb-90df-997eca595d35", "identifier": "PLA-44", "title": "GP-09 revisar se o módulo de captura de PDPs está alinhado com as técnicas ensinadas.", "description": "**GP-09.** Quando chegar em **MBA-C-08** (Web Scraping): revisar se o módulo de captura de PDPs está alinhado com as técnicas ensinadas. Documentar escolhas de arquitetura.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "709aca33-c300-47f5-b05f-2aafaff0b866", "identifier": "PLA-43", "title": "GP-08 Documentar como ghostprod usa spaCy para parseabilidade NLP", "description": "Quando chegar em **MBA-C-05** (Extração de Texto) e **MBA-C-06** (BoW): documentar como ghostprod usa spaCy para parseabilidade NLP — conteúdo \"vivo\" da disciplina.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "4577573f-299c-449b-911e-4de5429a182f", "identifier": "PLA-42", "title": "GP-07 Limpeza de pipeline e preparação", "description": "Aplicar **MBA-C-02** e **MBA-C-03** (tratamento/limpeza + preparação de atributos) à documentação do módulo de ingestão do ghostprod. Qual limpeza o pipeline faz? Qual preparação?", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "c1f10df6-f8b2-4029-b1f1-f73593a01aad", "identifier": "PLA-41", "title": "GP-06. Documentar a camada de descritiva do Agent-Readiness Score", "description": "**GP-06.** Documentar a camada de descritiva do Agent-Readiness Score aplicando **MBA-E-01** (Visualização + Análise descritiva). Descrever distribuição dos sub-scores do Natura. ", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "d463aae6-a228-4596-a660-31487a9289a5", "identifier": "PLA-40", "title": "GP-04. Documentar o score do Natura (53/100): qual URL, quando rodou, o que achou", "description": "", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "444e3fc2-52fa-4eb2-86fc-c60f13efce1d", "identifier": "PLA-39", "title": "GP-03. [Bloco 3] Mandar link + apresentação curta para: (a) consultora de RH (b) pessoa especial que indicou (~20 min)", "description": "", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "6a49654e-35fc-42e4-bf32-3a01de5a596c", "identifier": "PLA-38", "title": "GP-02. [Bloco 2] Escrever README curto: O que é / Por que existe / Como rodar / O que funciona / O que vem (~1h)", "description": "Readme já estava escrito porém faltava revisão. ", "state_name": "Done", "state_type": "completed", "labels": []}, {"id": "b1ece424-1cca-4d0f-b7bf-2a9b243782eb", "identifier": "PLA-37", "title": "GP-01. [Bloco 1] Abrir repo, rodar localmente, reler arquitetura — sem mexer em nada (~45 min)", "description": "", "state_name": "Todo", "state_type": "unstarted", "labels": []}], "total_count": 14, "completed_count": 1, "progress_pct": 7}], "no_milestone_issues": [{"id": "d596e765-b5c2-4d3d-91f5-7616c87732a3", "identifier": "PLA-56", "title": "Ghostprod: Handling Long API Scan Times (Beta Environment)", "description": "The user identified that `agent1_pagespeed.py` frequently takes a long time or fails due to Google's API behavior. The decision is to explicitly embrace this reality using a UI popup rather than hiding the delay.\n\n## **User Review Required**\n\n**WARNING**\n\nWe need your approval on the UI/UX approach for the popup before changing the frontend code.\n\n## **Proposed Changes**\n\n### **Frontend (**`ghostprod/frontend/src/App.tsx`)\n\n#### **\\[MODIFY\\] App.tsx**\n\nRather than an invasive \"click to dismiss\" popup, I propose injecting a prominent, stylistic **Beta Warning Banner** directly into the `loading` state. During the scan, when the Ghost icon is animating, we will display a dismissable (or persistent) alert box right below it that states something like:\n\n*\"BETA NOTICE: Real-time generation in progress. Google PageSpeed and Spacy NLP are parsing the live URL. This deep analysis may take up to 60 seconds to avoid API limit errors. Please don't refresh.\"*\n\nThis keeps the user anchored and manages expectations without breaking the cyberpunk aesthetic.\n\n### **Backend (**`ghostprod-core/backend/agents/agent1_pagespeed.py`)\n\n#### **\\[MODIFY\\] agent1_pagespeed.py**\n\n* Increase the `timeout` on `requests.get()` from 90s to `120s` (2 minutes).\n* Adjust the printed terminal output and the logging to reflect the increased tolerance for long loading times.\n\n## **Open Questions**\n\n* Do you specifically want a \"Modal/Popup\" that blocks the screen and requires the user to click \"OK, I understand\" *before* the scan starts? Or do you prefer the styling of a **prominent box/banner** that appears *during* the loading phase while the ghost is spinning?\n\n## **Verification Plan**\n\n* Inject the UI code and simulate a long response.\n* Update `npm run build` and `firebase deploy` to sync the changes to production.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "fdfb21ec-b192-4a36-bf7d-c5b14b4b6bda", "identifier": "PLA-55", "title": "DevOps System Design", "description": "# Ghostprod: DevOps & System Design FAQ\n\nEste documento responde às perguntas executivas sobre a arquitetura Cloud, CI/CD, segurança e escolhas de System Design feitas durante o empacotamento da versão 0.3 do Ghostprod. Ele foi redigido com uma perspectiva executiva de Liderança Técnica / Ops.\n\n---\n\n## 1\\. O Pipeline: Cadê o GitHub? O que é DevOps?\n\nO ambiente atual opera como uma arquitetura autônoma de *Local-to-Cloud Deployment*. O GitHub ainda não está no meio atuando como servidor de integração contínua (CI/CD) pois a esteira de publicação foi rodada localmente, de forma *Agentic* pelo terminal.\n\n**DevOps** é justamente a ponte tecnológica entre o código rodando fechado na máquina (*Dev*) e o produto vivo sendo entregue para clientes na internet de forma escalada (*Ops*). Neste projeto, o DevOps foi executado via comandos imperativos usando ferramentas de gerenciamento da nuvem (`gcloud CLI` e `firebase CLI`), operando pacotes encapsulados, autenticação e DNS.\n\n## 2\\. Lidando com Concorrência: Deadlocks e Playwright\n\n**O Problema (Deadlock):** Inicialmente, os Agentes 2 e 3 tentavam acionar instâncias separadas de um navegador \"invisível\" (*Headless Chrome*) na mesma fração de segundo via `ThreadPoolExecutor` do Python. Como a biblioteca subjacente `playwright` (sync_api) não é thread-safe sob o macOS, isso causava um curto-circuito (race condition) na memória: os dois processos se bloqueavam mutualmente num abraço mortal, travando o servidor principal `Uvicorn` e derrubando a porta :8000.\n\n**A Solução Estratégica:** Transicionamos chamadas de APIs diretas na rede (Google PageSpeed) para execução assíncrona tolerante a concorrência, enquanto isolamos o sub-motor do Navegador Web para uma Fila Estritamente *Sequencial*. A estabilidade virou 100% à custa de uns parcos 15s residuais.\n\n## 3\\. Segurança Anti-Bot: WAF Evasion contra Akamai\n\nGrandes plataformas corporativas (ex: Natura) utilizam **WAF (Web Application Firewall)** da Akamai ou Cloudflare, que ativamente policiam robôs e scraps.\nAnteriormente, nosso Headless Engine era negado imediatamente via Firewall com o erro *HTTP 403 Forbidden* simplesmente porque a assinatura (header de pacotes) o declarava como um robô autônomo.\n\n* **A Tática de Bypass:** Recorremos à ofuscação simples e eficiente (Spoofing) do *User-Agent* no motor Python. Falsificamos completamente a \"identidade\" do scraper, simulando a assinatura nativa do pacote de rede de um usuário real no navegador `Google Chrome / Microsoft Windows`. Com o \"RG\" falso em mãos, abrimos os domínios corporativos para coletar dados ricos (ex: marcações Schema e microtextos HTML) sem gerar ruídos ou flagrantes nos filtros de proteção de IPs.\n\n## 4\\. O Padrão Ouro do Empacotamento: Docker\n\n\"*Na minha máquina funciona*\" nunca existe em arquitetura Cloud. O **Docker** entra para encapsular nosso script numa cápsula universal. Ele congela dezenas de dependências espalhadas pelo seu Mac, misturando isso a um sistema operacional *Debian Linux* puro, e monta um HD virtual.\nExistem inúmeras variantes e tamanhos de imagens para essa fundação (*Alpine*, *Ubuntu*, *Slim*). Porém, adotamos arbitrariamente a super imagem pré-fabricada da Microsoft (`mcr.microsoft.com/playwright:v1.40.0-jammy`) porque montar do zero navegadores C++ Chromium dentro de conteineres Linux em nuvem despende semanas de rastreamento de instabilidades gráficas.\n\n## 5\\. Elasticidade na Nuvem: Google Cloud Run vs Lambdas\n\nSubstituímos o servidor antigo (ligado 24h pagando caro) pela matriz Serverless (FaaS - *Function as a Service*), de comportamento gêmeo do famoso AWS Lambda e das Github M/Functions.\n\n* Quando nenhum de seus clientes acessa o site, o servidor do GCP recua as máquinas e as hiberna para **Zero**. Custo Base = USD $0.00.\n* **Defesa Econômica (**`--max-instances=2`): Optamos por restringir severamente as turbinas do autoscaling limitando o pico dinâmico a apénas 2 contâineres. Se a aplicação sofrer um boom de mídia e 5.000 clientes gerarem requisições simultâneas, o modelo do Google Cloud não alocará dinamicamente 5.000 servidores paralelos (evitando que seu cartão de crédito receba uma conta obscenamente colossal ou ataque DDoS pago). A máquina em si cria apenas um engarrafamento de fila longo e saudável, dentro do *Free Tier*.\n\n## 6\\. O Cofre Forte: Secret Manager\n\nChaves-mestras das APIs pagas não são hardcoded localmente para evitar perigos gigantes de intrusos injetando hacks nas faturas (excesso de cota). As inserimos ativamente nas Variáveis de Ambiente e em abóbadas fechadas (*Secret Manager* via injeção Serverless). Os desenvolvedores não leem de volta essas chaves uma vez salvas em nuvem, protegendo o código inteiramente de desastres de integridade de Git.\n\n## 7\\. Filosofia Operacional e o Hack do CORS\n\nEnquanto operávamos a união da Tela V0.3 no Firebase com a Nuvem do Cloud Run, esbarramos no Erro de Browser (*\"Failed to Fetch\"*), gerado ativamente por políticas internas de restrição cruzada dos browsers de clientes - vulgo mecanismo **CORS**.\n\n* **A Resolução Rápida na Trincheira:** Invés de retornar aos pilares antigos, reabri-lo, codificá-lo localmente o novo domínio, testar, e esperar o build arrastado pelo Docker levar ±4 minutos para deploy total – agimos como *Platform Engineers* táticos. Pelo terminal local (CLI da nuvem) sobreescrevemos o array permissível no ar sob o estado ativo (`gcloud run services update --update-env-vars`), rebotamos suavemente em exatos 3 segundos injetando magicamente a autorização VIP no cérebro isolado e o conserto foi massificado imediatamente.\n\n## 8\\. Stack de Inteligência Nativa: Gemini vs. Família Gemma\n\n* **Modelagem Atual Avançada:** A engine analítica que orquestra Gap Analysis nos JSONLd é executada usando **Gemini 1.5 Flash**. Com a repatriação da arquitetura e APIs Cloud para ecossistema único (GCP + Firebase) destituímos da engrenagem subjacente o motor Claude antigo, unificando a API em uma latência de processamento inferida estupidamente veloz.\n* **A Diferença e Desafio do Model 'Gemma':** E a família estrutural orgânica paralela Gemma? Gemma tem um modelo focado abertamente nos *Open Weights*. Apesar de podermos operar nela, usar localmente necessita de alocações caras e complexas GPU-dependentes (exemplo via endpoints Ollama) ao passo em que APIs Serverless e públicas generativas são restritas ao modelo Gemini robusto.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "40ab5b4e-fe67-41bc-86e5-29a0dc700f1c", "identifier": "PLA-53", "title": "Ghostprod: Documentação Técnica e Arquitetura", "description": "# Ghostprod: Documentação Técnica e Arquitetura\n\nBem-vindo à documentação oficial do motor de extração **Ghostprod** (v0.3). Este documento foi escrito sob a perspectiva da Liderança Técnica (Tech Lead) da aplicação para facilitar o onboarding de desenvolvedores, e explicar a transição da aplicação local (v0.2) para a Arquitetura Robusta em Nuvem (v0.3).\n\n---\n\n## 1\\. Visão Geral da Arquitetura (v0.3 - Cloud Múltipla)\n\nO Ghostprod evoluiu de um script local para uma arquitetura \"Severless\" separada e profissional:\n\n* **Frontend (React/Vite) na Firebase Hosting:** A interface de usuário (SPA). Envia as variáveis e a URL para o Cloud Run. Endereço oficial: `https://ghostprod-b2c3d.web.app`\n* **Backend (FastAPI/Python) no Google Cloud Run:** O cérebro corporativo. Rodando isolado via **Docker**. Processa a IA e regras de negócios. Endereço oficial: `https://ghostprod-backend-399766280478.us-east1.run.app`\n\n---\n\n## 2\\. A Decisão Arquitetural Mais Importante: Paralelismo x Sequencial\n\nNo design original do aplicativo, o arquivo `orchestrator.py` tentava disparar todos os Agentes (1 ao 3) ao mesmo tempo usando o `ThreadPoolExecutor` (fios de processamento paralelos de CPU). Isso foi projetado para economizar tempo, pois cada agente demora de 10 a 15 segundos para rodar.\n\n### O Incidente do Deadlock (Travamento da Porta 8000)\n\nA biblioteca responsável por abrir os navegadores Chrome invisíveis (`playwright` na sua `sync_api`) **não é thread-safe**. Quando o Orquestrador mandava o Agente 2 e o Agente 3 abrirem o Chrome no mesmo milissegundo em threads separadas no macOS, o motor interno do Python entrava em curto-circuito (Deadlock/Bootstrap loop), causando o que o navegador reportava como `ERR_CONNECTION_TIMED_OUT`.\n\n**A Solução Híbrida (Vigorando Hoje):**\nPara garantir que o servidor nunca mais trave e nem perca dados em URLs pesadas (como a Home Page ou PDPs com muitas UTMs na URL), o `orchestrator.py` foi re-arquitetado para um formato híbrido:\n\n1. **Agentes de Nuvem (Threads Rápidas):** Tudo o que for chamada de API pura (`requests` para o Google) roda em **paralelo**. Portanto, os dados do PageSpeed são colhidos quase instantaneamente, juntos.\n2. **Agentes de Navegação (Fila Sequencial):** Tudo o que envolver abrir o navegador Playwright (Agente 2 e Agente 3) agora roda sequencialmente. O Agente 3 só começa quando o Agente 2 termina. É mais lento? Sim (adiciona \\~15 segundos ao tempo total da requisição). Mas garante 100% de estabilidade de memória e previne corrupção do loop assíncrono do servidor `Uvicorn`.\n\n---\n\n## 3\\. O Mapa dos Arquivos: Os 5 Agentes de IA\n\nCada arquivo na pasta `agents/` possui uma responsabilidade micro-focada que se junta no resultado do `orchestrator.py`.\n\n### ⚡ `agent1_pagespeed.py`\n\n* **Objetivo:** Bate na API oficial do Google PageSpeed Insights.\n* **Mecânica:** Retorna os Core Web Vitals da URL via chamadas HTTP REST.\n* **Decisão Técnica:** Obrigatório possuir a chave `PSI_API_KEY` cadastrada nas variáveis de ambiente. Caso o Google estoure a cota de limite diário (Erro 400 ou 429), ele devolverá o erro graciosamente via JSON sem derrubar o Uvicorn, para não comprometer o escaneamento do resto no Front.\n\n### 🛑 `agent1_crux.py` (Atualmente de Férias)\n\n* **Objetivo:** Bateria na API do Chrome UX Report para o dado de campo *histórico*.\n* **Decisão Técnica:** Hoje, ele sofre um **Bypass Intencional**. Ele retorna `score: 0` diretamente do código. A decisão foi tomada porque o front-end ainda não possui o dashboard de acompanhamento histórico estilo DebugBear. Chamar a API diariamente a cada F5 gastaria recursos absurdos de rede sem servir a tela.\n\n### 🕵️‍♀️ `agent2_schema.py`\n\n* **Objetivo:** Renderizar a página de produto usando um Headless Chrome (Playwright) para ler o código JSON-LD oculto que os Agentes da OpenAI/Google leem.\n* **Decisão Técnica Anti-Bot:** Antigamente, o firewall WAF da Akamai contratado pela Natura identificava a assinatura clássica do robô (`HeadlessChrome`) e bloqueava a requisição com um erro 403 Forbidden. Para contornar, foi injetado um `User-Agent` universal do Windows/Chrome no método `browser.new_page()`. Agora, aos olhos do Akamai, o código Python é apenas um consumidor visitando o site.\n\n### 📖 `agent3_nlp.py`\n\n* **Objetivo:** Também usa Chrome Headless com a técnica de WAF Evasion para baixar todo o texto legível da tela. Através da engine de linguística NLP (SpaCy), conta quantas vezes jargões \"técnicos de dermatologia\" aparecem.\n\n### 🧑‍⚖️ `agent2_5_schema_quality.py`\n\n* **Objetivo:** Um filtro de auditoria interna. Como o Agente 2 só vê \"estrutura\" (se o campo do preço existe), o Agente 2.5 avalia a *\"qualidade da fofoca\"*. Se o texto do Schema estiver inundado de \"marketing gloss\" (ex: descontos, superscripts de rodapé `¹`, símbolos e propagandas da Black Friday invés de dados concretos do produto), este agente penaliza a nota.\n\n### 🤖 `agent4_gap.py`\n\n* **Objetivo:** O Gran Finale. Pega os dados técnicos garimpados e monta o \"Dossiê\".\n* **Decisão Técnica Recente:** Originalmente programado em Anthropic Claude 3.5. Por decisão de negócio e padronização com a nuvem GCP, o motor foi **migrado para Google Gemini 1.5 Flash**. A biblioteca `google-generativeai` foi ancorada no projeto, e toda a lógica refatorada para utilizar o método `model.generate_content()`. Ele se baseia puramente na resposta textual para descobrir se o produto está \"Agent-Ready\" para um consumidor.\n\n---\n\n## 4\\. A Passagem para Produção: CI/CD e Infraestrutura Cloud (v0.3)\n\nO maior salto arquitetural ocorreu na transição da máquina local para a Nuvem, usando 3 grandes pilares tecnológicos.\n\n### O Empacotamento: Docker e a necessidade do Playwright\n\nPara levar a aplicação à nuvem, não poderíamos apenas \"copiar a pasta Python\". O servidor do Google precisava ter o Chrome original e todas as bibliotecas de sistema C++ instaladas silenciosamente para o **Agente 2 (Schema)** conseguir abrir páginas ocultas.\n\n* **A Solução:** Utilizamos o **Docker**, conectando-se na imagem oficial da Microsoft (`mcr.microsoft.com/playwright:v1.40.0-jammy`). O Docker criou uma \"cápsula Linux\" que instalou o sistema de pacotes, garantindo que o código funcionasse 100% igual ao que rodava no seu Mac M1.\n\n### O Hospedeiro do Cérebro: Google Cloud Run & Secret Manager\n\nUma vez que cápsula Docker foi fechada e empurrada para os servidores via `gcloud`, usamos o **Google Cloud Run** para ligá-la à tomada da internet.\n\n* **Vantagem de Negócio:** O Cloud Run é Serverless. Ele diminui as máquinas a 0 quando você está dormindo e não te cobra 1 centavo inativo. Tivemos que forçar a configuração para a \"Camada Gratuita\" limitando a concorrência a 2 instâncias máximas (`--max-instances=2`).\n* **Gerenciamento de API Keys:** Para não expor as chaves do Gemini no código, excluímos o `.env` do Dockerfile e codificamos essas chaves como segredos embutidos direto na infraestrutura do Google Cloud.\n\n### O Hospedeiro da Cara: Firebase Hosting\n\nO Frontend em React.js (Vite) não usa Docker, pois não tem banco de dados, é apenas código de tela puramente \"estático\".\n\n* **Solução:** Utilizamos o **Firebase Hosting** do Google devido à sua facilidade e CDN global de alta velocidade gratuita.\n* **A \"Mágica\" da Conexão:** Tivemos que injetar o arquivo local `.env.production` contendo a variável `VITE_API_URL` antes de gerar a versão final compressa (`npm run build`). Isso instruiu o código: \"quando rodar no Firebase, não procure por processos `localhost`, comunique-se exclusivamente com a URL HTTPS oficial do Cloud Run\".\n\n---\n\n## 5\\. O Desafio Final das Trincheiras: O Famoso \"CORS\"\n\nNo minuto da V0.3 ir ao ar no Firebase, os botões falharam e exibiram **\"Failed to fetch\"**.\n\n**A Lógica Técnica:** O erro foi engatilhado pelo **CORS** (Cross-Origin Resource Sharing). O CORS é uma política rigorosa de segurança invisível mantida pelos navegadores web modernos (Chrome/Safari) para impedir fraudes financeiras e hacks XSS.\nComo a sua tela oficial morava no portal `https://ghostprod-b2c3d.web.app` (Origem A) e fazia uma requisição XMLHttpRequest direta e assíncrona contra a engrenagem profunda no `https://ghostprod-backend-399766280478` (Origem B), o Backend avaliou a assinatura e recusou o convite. O Backend no código possuía apenas permissão para dar a mão à chamadas que viessem explicitamente do `localhost:3000` ou da família oficial configurada.\n\n**A Resolução Executiva:**\nPara corrigir isso instantaneamente sem rebobinar os 5 minutos lentos da \"Instalação Docker\" de novo, hackeamos via linha de comando (`gcloud run services update`) as variáveis de estado do Google Cloud injetando magicamente a URL do Firebase nas permissões explícitas do motor de Python (`ALLOWED_ORIGINS`). O servidor fez um reload em branco em 3 segundos, reconheceu a URL na lista VIP e destravou o fluxo completo de dados front/back.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "48d8cfba-088a-41a0-aa97-e0a621e297bb", "identifier": "PLA-52", "title": "Plano de Implementação: Evasão Antibot (Akamai WAF) no Backend Python", "description": "## **Diagnóstico**\n\nO frontend React envia a URL via POST para o backend Python (`ghostprod-core/backend`). Lá, os agentes utilizam a biblioteca **Playwright** para renderizar a página. Atualmente, o Playwright está sendo iniciado em modo *headless* sem nenhum cabeçalho customizado. Isso faz com que ele se identifique com a assinatura padrão `HeadlessChrome`, o qual é imediatamente bloqueado pelo firewall Akamai da Natura com um erro 403.\n\n## **Proposed Changes**\n\n### `ghostprod-core/backend/agents/agent2_schema.py`\n\nAdicionar o parâmetro de `user_agent` na criação da página para forçar o Playwright a mentir sobre sua identidade.\n\n#### **\\[MODIFY\\] agent2_schema.py**\n\n* Na linha `page = browser.new_page()`, adicionar: `user_agent=\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36\"`\n\n### `ghostprod-core/backend/agents/agent3_nlp.py`\n\nAplicar a mesma técnica de evasão para o rastreador de densidade NLP.\n\n#### **\\[MODIFY\\] agent3_nlp.py**\n\n* Na linha `page = browser.new_page()`, adicionar a *string* do User-Agent idêntica à do agente 2.\n\n### `ghostprod-core/backend/scanner.py`\n\nAtualizar o script utilitário de scanner para, caso venha a ser testado manualmente, também superar o WAF.\n\n#### **\\[MODIFY\\] scanner.py**\n\n* Atualizar a função `scan_simples` de `AgenticAudit/1.0` para o Chrome User-Agent.\n* Atualizar a função `scan_playwright()` adicionando o parâmetro no `browser.new_page()`.\n\n## **Verification Plan**\n\n* Após essa correção, você testará novamente a URL da Natura na interface de React em `localhost:3000`.\n* O backend Python passará tranquilamente pelo Firewall e extrairá finalmente os dados da PDP.\n* O resultado aparecerá com sucesso no frontend junto com a nota atualizada.\n\n---\n\n# **Plano de Implementação: Migração Claude para Gemini**\n\n## **Diagnóstico**\n\nO usuário solicitou a troca do provedor de IA base do projeto. Atualmente, o Agente 4 (Gap Analysis) na pasta `ghostprod-core/backend/agents/agent4_gap.py` utiliza a API da Anthropic (Claude 3.5 Sonnet) para gerar as respostas. Vamos substituí-lo pela API do Google Gemini (flash).\n\n## **Proposed Changes**\n\n### `ghostprod-core/backend/requirements.txt`\n\n* Remover `anthropic==0.42.0`\n* Adicionar `google-generativeai>=0.8.0`\n\n### `ghostprod-core/backend/agents/agent4_gap.py`\n\n* Substituir as importações da `anthropic` e a busca pela chave `ANTHROPIC_API_KEY`.\n* Injetar o Client de IA do Google (`import google.generativeai as genai`).\n* Trocar a variável de checagem para `GEMINI_API_KEY`.\n* Substituir o método `client.messages.create` pelo método `model.generate_content(prompt)` usando o modelo `gemini-1.5-flash` (ou `gemini-2.5-flash` dependendo do suporte).\n\n## **Verification Plan**\n\n1. Rodar `pip install google-generativeai` no terminal do backend.\n2. Atualizar o arquivo `.env` para incluir `GEMINI_API_KEY=suachave`.\n3. Testar a análise de novo via React Frontend. O diagnóstico será retornado pela IA do Google.\n\n---\n\n# **Plano de Implementação: CrUX Pipeline (Dados Históricos)**\n\n## **Diagnóstico**\n\nO script `crux_pipeline.py` foi projetado para ler dados da Chrome UX Report API (dados de usuários reais) e armazená-los periodicamente, funcionando como um gerador de série temporal (semelhante ao dashboard do DebugBear). A usuária solicitou a criação de um dicionário fixo (lista de URLs alvo do setor de beleza brasileiro) para automatizar esse preenchimento.\n\n## **Proposed Changes**\n\n### `ghostprod-core/backend/data/target_urls.json`\n\n* Criar um json contendo o dicionário onde a chave é o nome da marca e o valor é a URL. \\[NEW\\]\n\n### `ghostprod-core/backend/crux_pipeline.py`\n\n* Adicionar o parser de argumentos nativo do Python (`argparse`) para habilitar formalmente o uso das flags `--url` e `--file`.\n* Ler e iterar sobre o dicionário de marcas carregado de `data/target_urls.json`.\n\n## **Verification Plan**\n\n* Rodar o arquivo `python crux_pipeline.py --file data/target_urls.json` para testar se a leitura do dicionário está processando perfeitamente as 10 marcas indicadas pela usuária.\n\n---\n\n# **Plano de Implementação: Frontend Core Web Vitals (Numerinhos)**\n\n## **Diagnóstico**\n\nA usuária solicitou a exibição da \"linha de numerinhos\" que corresponde à seção de métricas brutas (milissegundos e segundos) vistas na interface web do PageSpeed Insights. Essas métricas são conhecidas como **Core Web Vitals** (ou Métricas de Desempenho).\n\nEmbora o backend em `agent1_pagespeed.py` já extraia esses dados da API do Google (retornando LCP, TBT, CLS, etc., dentro do objeto `metricas`), nosso React atual (`App.tsx`) consome e desenha apenas as notas gerais (Performance, Acessibilidade, etc) nos componentes `CircularScore`.\n\n## **Proposed Changes**\n\n### `ghostprod/frontend/src/App.tsx`\n\n* Adicionar no TypeScript `interface AnalysisResult` o mapeamento para as métricas detalhadas (ex: `lcp: string`, `tbt: string`, etc). \\[MODIFY\\]\n* Extrair `data.agentes.pagespeed.metricas` na função `setResult()`. \\[MODIFY\\]\n* Criar um novo bloco visual em `App.tsx`, logo abaixo das 4 bolinhas, nomeado \"Core Web Vitals\" que renderize uma grade com os valores numéricos em destaque usando badges ou ícones limpos. \\[MODIFY\\]\n\n## **Verification Plan**\n\n* Rodar a análise novamente na interface local `localhost:3000` via botão \"Analyze\".\n* Verificar de forma visual se a linha de \"numerinhos\" aparece contendo LCP, CLS, FCP e TBT com a formatação correta.", "state_name": "In Review", "state_type": "started", "labels": ["Documentation"]}, {"id": "ad6f97b1-19a5-4f01-a672-8ba1b9338208", "identifier": "PLA-46", "title": "GP-11 modelar qual peso cada eixo (performance, schema, NLP) tem no score final usando regressão", "description": "**GP-11.** Quando chegar em **MBA-E-07** (Regressão): modelar qual peso cada eixo (performance, schema, NLP) tem no score final usando regressão. Transforma o ARS de fórmula arbitrária em modelo defensável estatisticamente.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "d8d85e95-5ede-4065-9de0-32021462a5a1", "identifier": "PLA-45", "title": "GP-10 rodar teste sobre os scores do ghostprod", "description": "Quando chegar em **MBA-E-05** (Teste de hipóteses): rodar teste sobre os scores do ghostprod (ex: \"sites com Schema.org completo têm score significativamente maior?\"). Vira seção de validação empírica da tese.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "4d12dec4-d2d3-4fdb-90df-997eca595d35", "identifier": "PLA-44", "title": "GP-09 revisar se o módulo de captura de PDPs está alinhado com as técnicas ensinadas.", "description": "**GP-09.** Quando chegar em **MBA-C-08** (Web Scraping): revisar se o módulo de captura de PDPs está alinhado com as técnicas ensinadas. Documentar escolhas de arquitetura.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "709aca33-c300-47f5-b05f-2aafaff0b866", "identifier": "PLA-43", "title": "GP-08 Documentar como ghostprod usa spaCy para parseabilidade NLP", "description": "Quando chegar em **MBA-C-05** (Extração de Texto) e **MBA-C-06** (BoW): documentar como ghostprod usa spaCy para parseabilidade NLP — conteúdo \"vivo\" da disciplina.", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "4577573f-299c-449b-911e-4de5429a182f", "identifier": "PLA-42", "title": "GP-07 Limpeza de pipeline e preparação", "description": "Aplicar **MBA-C-02** e **MBA-C-03** (tratamento/limpeza + preparação de atributos) à documentação do módulo de ingestão do ghostprod. Qual limpeza o pipeline faz? Qual preparação?", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "c1f10df6-f8b2-4029-b1f1-f73593a01aad", "identifier": "PLA-41", "title": "GP-06. Documentar a camada de descritiva do Agent-Readiness Score", "description": "**GP-06.** Documentar a camada de descritiva do Agent-Readiness Score aplicando **MBA-E-01** (Visualização + Análise descritiva). Descrever distribuição dos sub-scores do Natura. ", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "d463aae6-a228-4596-a660-31487a9289a5", "identifier": "PLA-40", "title": "GP-04. Documentar o score do Natura (53/100): qual URL, quando rodou, o que achou", "description": "", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "444e3fc2-52fa-4eb2-86fc-c60f13efce1d", "identifier": "PLA-39", "title": "GP-03. [Bloco 3] Mandar link + apresentação curta para: (a) consultora de RH (b) pessoa especial que indicou (~20 min)", "description": "", "state_name": "Todo", "state_type": "unstarted", "labels": []}, {"id": "6a49654e-35fc-42e4-bf32-3a01de5a596c", "identifier": "PLA-38", "title": "GP-02. [Bloco 2] Escrever README curto: O que é / Por que existe / Como rodar / O que funciona / O que vem (~1h)", "description": "Readme já estava escrito porém faltava revisão. ", "state_name": "Done", "state_type": "completed", "labels": []}, {"id": "b1ece424-1cca-4d0f-b7bf-2a9b243782eb", "identifier": "PLA-37", "title": "GP-01. [Bloco 1] Abrir repo, rodar localmente, reler arquitetura — sem mexer em nada (~45 min)", "description": "", "state_name": "Todo", "state_type": "unstarted", "labels": []}], "total_issues": 14, "completed_issues": 1, "progress_pct": 7, "id": "3ad1cf0d-019f-4e37-992d-131e8473d4b8"}, {"name": "Substack", "description": "", "milestones": [{"id": "no-milestone", "name": "Outras Atividades & TCC", "targetDate": null, "issues": [{"id": "bdcc0ba1-7d32-4e5a-a514-3ed0e0987fd7", "identifier": "PLA-54", "title": "Definir titulo.", "description": "# Eu não escrevi o código. Mas matei os servidores.\n\n## Como uma Product Manager colocou um produto de IA em produção dirigindo um agente de código\n\n---\n\nÀs 21h de uma terça-feira eu gritei pro Gemini: *pelo amor de Deus, mata os servidores.*\n\nEle estava preso num loop. Uma função ficava observando a porta 8000 e ele não conseguia gerar o arquivo `.env.production` que eu precisava. Toda vez que tentava criar o arquivo, o processo do servidor travava a operação.\n\nA solução? Matar o processo antes de gerar o arquivo. Não era um problema de código. Era um problema de sequência. E quem viu isso não foi o agente de código — fui eu.\n\nFoi assim que eu, uma Product Manager que não codifica Python fluente, coloquei um produto de 5 agentes de IA em produção no Google Cloud. **Em duas horas.**\n\n---\n\n## O que é o ghostprod (e por que existe)\n\nO ghostprod é uma ferramenta que mede o **Agent-Readiness Score** de páginas de produto em e-commerces. Em outras palavras: quando um agente de IA (como o ChatGPT, o Gemini ou qualquer assistente de compras do futuro) visitar uma página de produto pra decidir se recomenda aquele item ao consumidor, ele vai conseguir ler e entender o que está ali?\n\nA maioria dos e-commerces não está pronta pra isso. E quase ninguém está medindo.\n\nO ghostprod mede — combinando dados de performance (PageSpeed / Core Web Vitals), dados estruturados ([Schema.org](<http://Schema.org>)) e parseabilidade de texto (NLP com spaCy). É o produto do meu TCC do MBA em Data Science na USP, e nasceu de um problema real que eu vi em primeira mão como Product Manager de e-commerce na Cencosud, liderando operações digitais no Brasil e na América Latina.\n\n---\n\n## A arquitetura (explicada pra gente normal)\n\nO ghostprod tem duas partes:\n\n**A cara:** uma interface em React onde tu cola a URL de um produto e clica \"Analisar\". Essa interface mora no Firebase Hosting do Google — que é basicamente uma vitrine global rápida e gratuita.\n\n**O cérebro:** um servidor em Python (FastAPI) que roda no Google Cloud Run, empacotado dentro de um container Docker. Quando tu clica \"Analisar\", esse servidor aciona 5 agentes especializados, cada um com uma missão:\n\n* **Agente 1** bate na API do Google PageSpeed e traz os Core Web Vitals da página.\n* **Agente 2** abre um navegador Chrome invisível (headless) pra ler os dados estruturados (JSON-LD) que só aparecem depois que o JavaScript da página roda.\n* **Agente 2.5** audita a *qualidade* desses dados — se o [Schema.org](<http://Schema.org>) tá cheio de marketing vazio em vez de informação real do produto, ele penaliza a nota.\n* **Agente 3** também abre Chrome headless, mas pra extrair o texto visível da página e analisar com NLP (spaCy) quão legível e técnico ele é.\n* **Agente 4** pega tudo isso e monta um \"dossiê\" usando a API do Gemini, avaliando se o produto está pronto pra ser lido por agentes de IA.\n\nO resultado é um score de 0 a 100. O primeiro que produzi foi da Natura: **53/100**. Não é terrível. Mas também não é bom. E agora eu sei *exatamente* onde estão os gaps.\n\n---\n\n## Como eu dirigi o Gemini (a parte honesta)\n\nEu preciso ser transparente aqui: **eu não escrevi o código do ghostprod linha por linha.** Eu usei o Gemini (via Antigravity, o fork do Google pro VS Code) como agente de código. Ele implementou. Eu dirigi.\n\nO que significa \"dirigir\"?\n\nSignifica que eu tomei todas as decisões de produto e arquitetura. O Gemini sabe escrever Python. Ele não sabe o que construir, nem por quê, nem quando parar.\n\nVou dar três exemplos concretos de momentos em que o agente travou e eu precisei intervir — não com código, mas com decisão.\n\n### Momento 1: \"Mata os servidores\"\n\nNa hora do deploy, o Gemini precisava gerar um arquivo de configuração (`.env.production`) pra dizer ao frontend onde encontrar o backend na nuvem. Mas o servidor local estava rodando e ocupando a porta. Toda tentativa de gerar o arquivo falhava silenciosamente.\n\nO Gemini ficou em loop tentando abordagens cada vez mais complexas. A solução era simples: **matar o processo do servidor primeiro, gerar o arquivo, depois subir de novo.** Eu vi o problema porque já passei por situações parecidas em operação — quando algo trava, a primeira pergunta é \"o que está ocupando o recurso?\", não \"como reescrevo o código?\".\n\n### Momento 2: \"O usuário não pode esperar pra sempre\"\n\nA API do PageSpeed pode demorar. Às vezes 15 segundos, às vezes 30. E quando tu consulta a mesma URL duas vezes seguidas, ela pode devolver um cache da consulta anterior.\n\nO Gemini queria implementar retry infinito. Eu vetei. **A decisão foi de UX, não de engenharia:** estendemos o timeout pra um limite razoável e mostramos feedback visual pro usuário durante a espera. Melhor uma resposta lenta com indicação de progresso do que uma tela congelada.\n\n### Momento 3: \"O firewall da Natura está nos bloqueando\"\n\nO Agente 2 (Schema) precisa abrir a página de produto num navegador headless pra ler os dados estruturados. Mas o firewall WAF da Akamai, contratado pela Natura, identificava a assinatura do robô (`HeadlessChrome`) e bloqueava com erro 403.\n\nO Gemini sugeriu soluções técnicas complexas. A minha pergunta foi mais simples: **\"o que o Akamai está lendo pra saber que somos robô?\"**. A resposta era o User-Agent. Injetamos um User-Agent de navegador real. Problema resolvido.\n\nAgora estamos investigando se o PageSpeed do Google também sofre bloqueio do Akamai em certas páginas da Natura — o que abriria uma discussão interessante sobre como firewalls corporativos podem, sem querer, prejudicar o SEO técnico do próprio cliente.\n\n---\n\n## O que eu aprendi\n\n**1. Agente de código não substitui PM.**\nEle precisa de alguém que saiba *o que pedir*, *quando parar*, e *o que testar*. Sem direção humana, o agente produz código que funciona tecnicamente mas não resolve o problema certo.\n\n**2. Deploy é onde a realidade bate.**\nTudo que funcionava no meu Mac travou na nuvem. CORS, portas, firewalls, secrets, permissões. Cada problema de deploy foi uma decisão de produto disfarçada de problema técnico.\n\n**3. Documentar decisões é tão importante quanto implementar.**\nEu pedi pro Gemini me gerar a documentação técnica do que ele fez. Não pra fingir que eu escrevi — pra entender o que foi construído e poder explicar pra qualquer pessoa. Se tu não consegue explicar a arquitetura do teu produto, tu não está liderando ele.\n\n**4. IA local vs. cloud não é decisão técnica — é decisão de negócio.**\nRodar tudo no meu Mac era grátis mas não escalava. Ir pra nuvem custou R$ 0 (free tier do GCP) mas exigiu Docker, Secret Manager, e configuração de CORS. Cada decisão de infraestrutura era uma decisão de custo, escala e manutenção.\n\n---\n\n## O que vem depois\n\nO ghostprod está em produção. Está longe de perfeito. Mas existe, roda, e mede algo que ninguém mais está medindo: a prontidão de um e-commerce pra ser lido por agentes de IA.\n\nOs próximos passos incluem persistir dados com timestamp pra comparar PageSpeed (dados de laboratório) com CrUX (dados reais de usuário), aplicar transformações de dados do meu MBA pra normalizar os scores, e decompor os agentes monolíticos em funções mais granulares no Google Cloud Functions.\n\nSe tu trabalha com e-commerce e quer testar o teu site, ou se tu é PM e quer conversar sobre como dirigir agentes de código em produção: o projeto é open source e eu estou aberta a conversas.\n\n**→ **[**ghostprod no GitHub**](<https://github.com/britneyscripts/ghostprod>)\n\n---\n\n*Eva D                 const totalText = milestone.total_count === 1 ? 'atividade' : 'atividades';
                const progressText = `${milestone.completed_count}/${milestone.total_count} ${totalText} (${milestone.progress_pct}%)`;
                
                milestoneDiv.innerHTML = `
                    <div class="flex justify-between items-center px-6 py-5 cursor-pointer hover:bg-zinc-800/10 select-none transition-all" onclick="toggleMilestone('${milestone.id}')">
                        <div class="flex-1 pr-4">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-baseline gap-2 mb-2">
                                <h3 class="text-base font-semibold font-heading text-white select-all">${milestone.name}</h3>
                                <span class="text-xs font-medium text-zinc-400 shrink-0 font-mono">${progressText}</span>
                            </div>
                            <!-- Mini Progress Bar -->
                            <div class="w-full bg-zinc-800/80 h-1 rounded-full overflow-hidden">
                                <div class="bg-gradient-to-r from-violet-500 to-indigo-500 h-full rounded-full transition-all duration-300" style="width: ${milestone.progress_pct}%"></div>
                            </div>
                        </div>
                        <button class="w-8 h-8 rounded-lg bg-zinc-800 border border-zinc-700/80 flex items-center justify-center text-zinc-400 hover:text-white hover:border-zinc-600 transition-all shrink-0 ml-2" id="btn-chevron-${milestone.id}">
                            <svg id="chevron-${milestone.id}" class="w-4 h-4 transition-transform duration-300" style="transform: ${isExpanded ? 'rotate(180deg)' : 'rotate(0deg)'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                    </div>
                    <div id="issues-list-${milestone.id}" class="${isExpanded ? '' : 'hidden'} border-t border-zinc-800 bg-zinc-950/40">
                        ${issuesListHtml}
                    </div>
                `;
                
                container.appendChild(milestoneDiv);
            });
            
            // If all filtered out
            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-zinc-900/30 border border-zinc-800 rounded-2xl">
                        <p class="text-sm text-zinc-500 font-heading">Nenhuma atividade corresponde aos filtros atuais.</p>
                    </div>
                `;
            }
        }

        // Run setup on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
